<app-header></app-header>
<div class="contact-wrapper">
  <div class="contact-card">
    <h2>Contact Us</h2>
    <p class="intro">
      Have questions, feedback, or partnership ideas? We’d love to hear from you.
    </p>

    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="contact-form">
      <div class="form-group">
        <label for="name"><i class="fas fa-user"></i> Name</label>
        <input id="name" formControlName="name" type="text" placeholder="Enter your name" />
        <small *ngIf="contactForm.get('name')?.invalid && contactForm.get('name')?.touched">
          Name is required.
        </small>
      </div>

      <div class="form-group">
        <label for="email"><i class="fas fa-envelope"></i> Email</label>
        <input id="email" formControlName="email" type="email" placeholder="Enter your email" />
        <small *ngIf="contactForm.get('email')?.invalid && contactForm.get('email')?.touched">
          Valid email is required.
        </small>
      </div>

      <div class="form-group">
        <label for="message"><i class="fas fa-comment-dots"></i> Message</label>
        <textarea id="message" formControlName="message" placeholder="Write your message"></textarea>
        <small *ngIf="contactForm.get('message')?.invalid && contactForm.get('message')?.touched">
          Message is required.
        </small>
      </div>

      <button type="submit" [disabled]="contactForm.invalid">
        <i class="fas fa-paper-plane"></i> Send Message
      </button>
    </form>

    <!-- Static Contact Info -->
    <div class="contact-info">
      <h3>Reach Us Directly</h3>
      <p><i class="fas fa-envelope"></i> Email: <a href="mailto:technomauli@gmail.com">technomauli@gmail.com</a></p>
      <p><i class="fas fa-phone"></i> Phone: <a href="tel:+918657734771">+91 8657734771</a></p>
      <p><i class="fas fa-globe"></i> Website: <a href="https://byte-buzz.netlify.app/" target="_blank">byte-buzz.netlify.app/</a></p>
    </div>
  </div>
</div>
<app-footer></app-footer>
